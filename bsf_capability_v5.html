/* ── FILTERS ── */
function populateFilters(){
  document.getElementById('regionFilter').insertAdjacentHTML('beforeend',buildRegionOpts(''));
  document.getElementById('themeFilter').insertAdjacentHTML('beforeend',buildThemeOpts(''));
}

function filterProjects(){
  if(nlqActive)return;
  const q=document.getElementById('searchInput').value.toLowerCase();
  const region=document.getElementById('regionFilter').value;
  const theme=document.getElementById('themeFilter').value;
  const ev=document.getElementById('evalFilter').value;
  const status=document.getElementById('statusFilter').value;
  filtered=ALL_PROJECTS.filter(p=>{
    if(q&&![p.title,p.country,p.partners,p.location,p.theme,p.objective,p.context,p.impact,p.id].join(' ').toLowerCase().includes(q))return false;
    if(region&&p.region!==region)return false;
    if(theme&&!p.theme.includes(theme))return false;
    if(ev&&p.eval_type!==ev)return false;
    if(status==='saved'&&pState[p.id]!=='saved')return false;
    if(status==='draft'&&pState[p.id]!=='draft')return false;
    if(status==='empty'&&pState[p.id]!=='empty'&&pState[p.id]!=='auto')return false;
    return true;
  });
  renderList();updateStats();
  if(currentTab==='timeline')renderTimeline();
  else if(currentView==='table')renderTable();
}

function updateStats(){
  const el=document.getElementById('hstat-shown');if(el)el.textContent=filtered.length;
  const se=document.getElementById('hstat-saved');if(se)se.textContent=Object.values(pState).filter(s=>s==='saved').length;
  const pc=document.getElementById('projCount');if(pc)pc.textContent=T('showing')+' '+filtered.length+' '+T('of')+' '+ALL_PROJECTS.length+' '+T('projects');
}

/* ── NLQ ── */
async function runNLQ(){
  const q=document.getElementById('nlqInput').value.trim();if(!q)return;
  const btn=document.getElementById('nlqBtn'),banner=document.getElementById('nlqBanner');
  btn.disabled=true;btn.textContent=T('nlq_thinking');
  banner.style.display='flex';
  banner.innerHTML='<div class="nlq-spinner"><div class="spin"></div>'+T('nlq_thinking')+'</div>';
  const idx=ALL_PROJECTS.map(p=>p.id+'|'+p.title+'|'+p.country+'|'+p.region+'|'+(p.start||'')+'|'+(p.end||'')+'|'+p.theme+'|'+p.partners+'|'+p.eval_type+'|'+p.objective.slice(0,100)+'|'+p.impact.slice(0,100)).join('\n');
  const sys=lang==='fr'
    ?"Tu es un assistant de recherche pour la base BSF. Réponds UNIQUEMENT avec une liste d'IDs séparés par des virgules (format BSF-PRJ-XXX). Maximum 60 IDs."
    :"You are a search assistant for the BSF project database. Reply ONLY with a comma-separated list of project IDs (format BSF-PRJ-XXX). Maximum 60 IDs.";
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:400,system:sys,messages:[{role:'user',content:'Query: '+q+'\n\nProjects:\n'+idx}]})});
    const data=await res.json();
    const ids=(data.content?.[0]?.text||'').split(',').map(s=>s.trim()).filter(id=>id.startsWith('BSF-PRJ-'));
    if(ids.length>0){
      nlqActive=true;
      filtered=ALL_PROJECTS.filter(p=>ids.includes(p.id));
      banner.innerHTML='<span>'+T('showing')+' <strong>'+filtered.length+'</strong> '+T('projects')+' '+(lang==='fr'?'pour':'for')+' "<em>'+q.replace(/</g,'&lt;')+'</em>"</span><button class="nlq-clear-btn" onclick="clearNLQ()">'+T('nlq_clear')+'</button>';
      document.getElementById('nlqClear').style.display='inline-flex';
    }else{
      banner.innerHTML='<span>'+T('nlq_none')+' "<em>'+q.replace(/</g,'&lt;')+'</em>"</span>';
      filtered=[...ALL_PROJECTS];
    }
  }catch(e){
    const kw=q.toLowerCase();
    filtered=ALL_PROJECTS.filter(p=>[p.title,p.theme,p.country,p.partners,p.objective,p.impact].join(' ').toLowerCase().includes(kw));
    banner.innerHTML='<span style="color:var(--bsf-coral)">⚠ '+T('nlq_fallback')+'</span>';
  }
  renderList();updateStats();
  if(currentTab==='timeline')renderTimeline();
  else if(currentView==='table')renderTable();
  btn.disabled=false;btn.textContent=T('nlq_btn');
}

/* ── LINKS ── */
function buildLinks(p){
  if(p.links&&p.links.length){
    return p.links.map(url=>{
      const label=url.includes('sharepoint')?T('sharepoint_doc'):url.includes('bibliosansfrontieres')?T('bsf_report'):T('view_report');
      return '<a href="'+url+'" target="_blank" rel="noopener noreferrer" style="display:block;color:var(--bsf-coral);font-weight:700;font-size:13px;text-decoration:none;margin-bottom:4px;word-break:break-all">↗ '+label+'</a>';
    }).join('');
  }
  if(p.doc_name)return '<span style="font-size:12px;color:var(--bsf-ink-2)">📄 '+p.doc_name+'</span>';
  return '<span class="fc-missing">'+T('not_doc')+'</span>';
}
function buildTableLink(p){
  if(p.links&&p.links.length)return '<a href="'+p.links[0]+'" target="_blank" rel="noopener noreferrer" style="color:var(--bsf-coral);font-weight:700;font-size:11px;text-decoration:none">↗</a>';
  if(p.doc_name)return '<span title="'+p.doc_name+'">📄</span>';
  return '<span class="t-none">—</span>';
}

/* ── DETAIL ── */
function renderDetail(p){
  const st=pState[p.id],para=pContent[p.id],content=para[lang]||para.en||'';
  const rColor=rc(p.region);
  const evalCls=p.eval_type==='RCT'||p.eval_type==='External evaluation'||p.eval_type==='Baseline / Endline'?'chip-leaf':'chip-eval';
  const budget=p.budget?parseInt(p.budget).toLocaleString()+' '+p.currency:'';
  const [badgeCls,badgeTxt]=st==='saved'?['sbadge-saved',T('status_saved')]:st==='draft'?['sbadge-draft',T('status_draft')]:st==='auto'?['sbadge-auto',T('status_auto')]:['sbadge-empty',T('status_empty')];
  const footTxt=st==='saved'?T('foot_saved'):st==='draft'?T('foot_draft'):st==='auto'?T('foot_auto'):'';

  const el=document.getElementById('content');
  el.innerHTML=
    '<div class="ctopbar"><div class="vtoggle">'
    +'<button class="vbtn '+(currentView==='detail'?'active':'')+'" onclick="setView(\'detail\')">'+T('detail')+'</button>'
    +'<button class="vbtn '+(currentView==='table'?'active':'')+'" onclick="setView(\'table\')">'+T('ref_table')+'</button>'
    +'</div><div class="ctopbar-right">'+(p.flagship?'⭐ '+T('flagship')+' · ':'')+p.id+'</div></div>'
    +'<div class="proj-detail">'
    +'<div class="d-id">'+p.id+'</div><div class="d-title">'+p.title+'</div>'
    +'<div class="chips">'
    +'<span class="chip chip-deep">'+p.country.split(';')[0].trim()+'</span>'
    +'<span class="chip chip-stone">'+(p.start||'?')+' – '+(p.end||T('ongoing'))+'</span>'
    +(p.region?'<span class="chip" style="background:'+rColor+'18;color:'+rColor+';border-color:'+rColor+'35">'+p.region+'</span>':'')
    +(budget?'<span class="chip chip-stone">'+budget+'</span>':'')
    +(p.eval_type&&p.eval_type!=='Not documented'?'<span class="chip '+evalCls+'">'+p.eval_type+'</span>':'')
    +'</div>'
    +(p.location?'<div class="d-loc">📍 '+p.location+'</div>':'')
    +'<div class="cap-box"><div class="cap-hdr"><div class="cap-hdr-l">'
    +'<span class="cap-lbl">'+T('cap_label')+'</span><span class="sbadge '+badgeCls+'">'+badgeTxt+'</span>'
    +'</div><div class="cap-actions">'
    +(st!=='empty'?'<button class="btn btn-ghost" onclick="clearPara(\''+p.id+'\')">'+iconSvg('refresh')+T('btn_regen')+'</button>':'')
    +(st!=='saved'?'<button class="btn btn-primary" id="genBtn" onclick="generatePara(\''+p.id+'\')">'+iconSvg('zap')+T('btn_gen')+'</button>':'<button class="btn btn-ghost" onclick="editPara(\''+p.id+'\')">'+iconSvg('edit')+T('btn_edit')+'</button>')
    +(st==='draft'?'<button class="btn btn-save" onclick="savePara(\''+p.id+'\')">'+iconSvg('save')+T('btn_save')+'</button>':'')
    +'</div></div>'
    +'<div class="cap-body" id="cap-body">'
    +'<textarea class="para-ta" id="para-ta" '+(st==='saved'?'readonly ':'')+' placeholder="">'+content+'</textarea>'
    +'</div>'
    +'<div class="cap-footer"><span id="cap-meta">'+footTxt+'</span><span id="cap-chars">'+(content?content.length+' chars':'')+'</span></div>'
    +'</div>'
    +'<div class="fields-grid">'
    +fc('full',T('lbl_context'),p.context)
    +fc('',T('lbl_objective'),p.objective)
    +fc('',T('lbl_approach'),p.approach)
    +fc('full hl',T('lbl_impact'),p.impact)
    +fc('',T('lbl_kpis'),p.kpis)
    +fc('',T('lbl_partners'),p.partners)
    +fc('',T('lbl_benef'),p.beneficiary)

    +'</div></div>';

  if(ta&&st!=='saved')ta.addEventListener('input',()=>onEdit(p.id));

function fc(cls,name,val){
  return '<div class="fc '+(cls||'')+'"><div class="fc-name">'+name+'</div><div class="fc-val '+(cls.includes('hl')?'hl':'')+'">'+(val||'<span class="fc-missing">'+T('not_doc')+'</span>')+'</div></div>';
}

function iconSvg(name){
  const icons={
    refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>',
    zap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
    save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>',
  };
  return '<svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" style="width:13px;height:13px;stroke-width:2.5">'+icons[name].replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"')+'</svg>';

function onEdit(id){const ta=document.getElementById('para-ta');if(!ta)return;pContent[id][lang]=ta.value;pState[id]='draft';const cc=document.getElementById('cap-chars');if(cc)cc.textContent=ta.value.length+' chars';}
function editPara(id){pState[id]='draft';renderDetail(ALL_PROJECTS.find(x=>x.id===id));renderList();updateStats();}
function clearPara(id){pContent[id]={en:'',fr:''};pState[id]='empty';renderDetail(ALL_PROJECTS.find(x=>x.id===id));}
function savePara(id){const ta=document.getElementById('para-ta');if(ta)pContent[id][lang]=ta.value;pState[id]='saved';renderDetail(ALL_PROJECTS.find(x=>x.id===id));renderList();updateStats();showToast(T('toast_saved'));}

async function generatePara(id){
  const p=ALL_PROJECTS.find(x=>x.id===id);
  const btn=document.getElementById('genBtn'),body=document.getElementById('cap-body');
  if(btn){btn.disabled=true;btn.innerHTML='<div class="spin" style="width:13px;height:13px;border-width:2px;margin-right:6px"></div>…';}
  if(body)body.innerHTML='<div class="gen-spinner"><div class="spin"></div>'+T('gen_writing')+'</div>';
  const isFr=lang==='fr';
  const prompt=isFr
    ?'Tu es rédacteur pour BSF. Paragraphe de capacité (150-200 mots), prose continue, ne commence pas par "BSF", ton humaniste, en français.\n\nID: '+p.id+'\nTitre: '+p.title+'\nPays: '+p.country+', '+p.location+'\nAnnées: '+(p.start||'?')+'–'+(p.end||'en cours')+'\nThème: '+p.theme+'\nContexte: '+(p.context||'Non documenté')+'\nObjectif: '+p.objective+'\nApproche: '+(p.approach||'Non documenté')+'\nFinanceurs: '+p.partners+'\nÉvaluation: '+p.eval_type+'\nImpact: '+(p.impact||'Non documenté')+'\n\nRédige uniquement le paragraphe.'
    :'You are a writer for BSF. Capability-statement paragraph (150-200 words), continuous prose, do not start with "BSF", humanist tone, English.\n\nID: '+p.id+'\nTitle: '+p.title+'\nCountry: '+p.country+', '+p.location+'\nYears: '+(p.start||'?')+'–'+(p.end||'ongoing')+'\nTheme: '+p.theme+'\nContext: '+(p.context||'Not documented')+'\nObjective: '+p.objective+'\nApproach: '+(p.approach||'Not documented')+'\nFunders: '+p.partners+'\nEvaluation: '+p.eval_type+'\nImpact: '+(p.impact||'Not documented')+'\n\nWrite only the paragraph.';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    const text=data.content?.[0]?.text||'';
    pContent[id][lang]=text;pState[id]='draft';
    renderDetail(p);renderList();updateStats();
  }catch(e){
    if(body)body.innerHTML='<div class="gen-spinner" style="color:var(--bsf-coral)">'+T('gen_error')+'</div><textarea class="para-ta" id="para-ta"></textarea>';
    const ta=document.getElementById('para-ta');if(ta)ta.addEventListener('input',()=>onEdit(id));
  }
}

/* ── TIMELINE ── */
function renderTimeline(tlRegion,tlFlagship){
  tlRegion=tlRegion||'';tlFlagship=tlFlagship||'';
  const el=document.getElementById('content');
  const YS=2007,YE=2026,YRS=Array.from({length:YE-YS+1},(_,i)=>YS+i);
  const LW=240,YW=46,CY=2026,TW=LW+YRS.length*YW;
  let src=filtered.filter(p=>{if(tlRegion&&p.region!==tlRegion)return false;if(tlFlagship==='1'&&!p.flagship)return false;return true;});
  const ORDER=['East Africa','West Africa','Central Africa','Middle East / North Africa','Western Europe','Europe','South Asia','Asia / Southeast Asia','Latin America','Americas','Caribbean','Pacific','Global'];
  const byR={};src.forEach(p=>{const r=p.region||'Other';if(!byR[r])byR[r]=[];byR[r].push(p);});
  Object.values(byR).forEach(a=>a.sort((a,b)=>(a.start||9999)-(b.start||9999)));
  const ordR=ORDER.filter(r=>byR[r]&&byR[r].length>0),otherR=Object.keys(byR).filter(r=>!ORDER.includes(r)&&byR[r]);
  let rows='';
  [...ordR,...otherR].forEach(region=>{
    const projs=byR[region]||[];if(!projs.length)return;
    const col=rc(region);
    rows+='<div class="tl-section" style="width:'+TW+'px"><span style="width:8px;height:8px;border-radius:50%;background:'+col+';flex-shrink:0"></span>'+region+' <span style="opacity:.4;font-weight:400">('+projs.length+')</span></div>';
    projs.forEach(p=>{
      const s=p.start||YS,e=p.end||CY,lx=(s-YS)*YW,w=Math.max(8,(Math.min(e,YE)-s+1)*YW);
      const st=pState[p.id],sdot=st==='saved'?'<span style="width:5px;height:5px;background:white;border-radius:50%;display:inline-block;margin-right:3px;opacity:.8;flex-shrink:0"></span>':'';
      rows+='<div class="tl-row" style="width:'+TW+'px">'
        +'<div class="tl-label-col" onclick="openFromTL(\''+p.id+'\')" title="'+p.title.replace(/"/g,'&quot;')+'">'
        +(p.flagship?'<span style="color:var(--bsf-coral);font-size:9px;flex-shrink:0">★</span>':'<span style="width:12px"></span>')
        +'<div><div class="tl-pname">'+(p.title.length>30?p.title.slice(0,28)+'…':p.title)+'</div><div class="tl-pcountry">'+p.country.split(';')[0].trim()+'</div></div></div>'
        +'<div class="tl-grid">'+YRS.map((y,i)=>'<div class="tl-yl'+(y===CY?' cur':'')+'" style="left:'+i*YW+'px"></div>').join('')
        +'<div class="tl-bar'+(p.flagship?' flagship':'')+'" style="left:'+lx+'px;width:'+w+'px;background:'+col+';opacity:'+(p.flagship?1:0.72)+';'+(!p.end?'border-right:2px dashed rgba(255,255,255,.5)':'')+'" onclick="openFromTL(\''+p.id+'\')" onmouseenter="showTT(event,\''+p.id+'\')" onmouseleave="hideTT()">'
        +sdot+(w>50?'<span class="tl-bar-lbl">'+(p.title.length>32?p.title.slice(0,29)+'…':p.title)+'</span>':'')
        +'</div></div></div>';
    });
  });
  const rig=src.filter(p=>p.eval_type==='RCT'||p.eval_type==='External evaluation'||p.eval_type==='Baseline / Endline').length;
  el.innerHTML='<div class="timeline-container"><div class="tl-controls">'
    +'<div class="tl-ctrl-group"><span class="f-lbl">'+T('lbl_region')+'</span>'
    +'<select class="tl-sel" id="tl-reg" onchange="renderTimeline(this.value,document.getElementById(\'tl-fl\').value)"><option value="">'+T('all_regions')+'</option>'+buildRegionOpts(tlRegion)+'</select></div>'
    +'<div class="tl-ctrl-group"><span class="f-lbl">Show</span>'
    +'<select class="tl-sel" id="tl-fl" onchange="renderTimeline(document.getElementById(\'tl-reg\').value,this.value)"><option value="">'+T('tl_all')+'</option><option value="1"'+(tlFlagship==='1'?' selected':'')+'>'+T('tl_flagship')+'</option></select></div>'
    +'<div class="tl-stat-bar">'
    +'<div class="tl-stat"><div class="tl-stat-n">'+src.length+'</div><div class="tl-stat-l">'+T('projects')+'</div></div>'
    +'<div class="tl-stat"><div class="tl-stat-n">'+src.filter(p=>p.flagship).length+'</div><div class="tl-stat-l">'+T('leg_flagship')+'</div></div>'
    +'<div class="tl-stat"><div class="tl-stat-n">'+rig+'</div><div class="tl-stat-l">Rigorous eval</div></div>'
    +'<div class="tl-stat"><div class="tl-stat-n">'+Object.keys(byR).length+'</div><div class="tl-stat-l">'+T('leg_regions')+'</div></div>'
    +'</div></div>'
    +'<div class="tl-scroll"><div class="tl-canvas">'
    +'<div class="tl-year-header"><div style="width:'+LW+'px;flex-shrink:0;padding:8px 0;font-size:10px;font-weight:700;color:var(--bsf-ink-3);border-right:1px solid var(--bsf-stone)">'+(lang==='fr'?'Projet':'Project')+'</div>'
    +YRS.map(y=>'<div class="tl-year-cell'+(y===CY?' current':'')+'" style="width:'+YW+'px">'+y+'</div>').join('')
    +'</div>'+rows
    +'<div style="margin-top:20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding-bottom:8px">'
    +'<span style="font-size:10px;font-weight:700;color:var(--bsf-ink-3);text-transform:uppercase;letter-spacing:.08em">'+T('leg_regions')+'</span>'
    +'<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--bsf-ink-3)"><span style="width:22px;height:8px;background:var(--bsf-coral);border-radius:99px;opacity:.7;display:inline-block"></span>'+T('leg_project')+'</span>'
    +'<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--bsf-ink-3)"><span style="width:22px;height:12px;background:var(--bsf-coral);border-radius:99px;display:inline-block"></span>'+T('leg_flagship')+'</span>'
    +'<span style="font-size:11px;color:var(--bsf-ink-3)">'+T('leg_click')+'</span>'
    +'</div></div></div></div>';
}

/* ── TOOLTIP ── */
function showTT(e,id){
  const p=ALL_PROJECTS.find(x=>x.id===id);if(!p)return;
  const tt=document.getElementById('tooltip');
  document.getElementById('tt-title').textContent=p.title;
  document.getElementById('tt-meta').textContent=p.country+' · '+(p.start||'?')+'–'+(p.end||T('ongoing'))+(p.flagship?' · ★ '+T('flagship'):'');
  document.getElementById('tt-theme').textContent=p.theme.split(';')[0].trim()+(p.eval_type&&p.eval_type!=='Not documented'?' · '+p.eval_type:'');
  tt.classList.add('show');moveTT(e);
}
function moveTT(e){const tt=document.getElementById('tooltip');tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-10)+'px';}
function hideTT(){document.getElementById('tooltip').classList.remove('show');}
document.addEventListener('mousemove',e=>{const tt=document.getElementById('tooltip');if(tt&&tt.classList.contains('show'))moveTT(e);});

/* ── MAP ── */
let leafletMap=null,mapMarkers=[];
function renderMap(){
  const el=document.getElementById('content');
  el.innerHTML='<div class="map-container"><div class="map-controls">'
    +'<div class="map-ctrl-group"><span class="f-lbl">'+T('lbl_region')+'</span><select class="tl-sel" id="map-region" onchange="refreshMap()"><option value="">'+T('all_regions')+'</option>'+buildRegionOpts('')+'</select></div>'
    +'<div class="map-ctrl-group"><span class="f-lbl">'+T('lbl_theme')+'</span><select class="tl-sel" id="map-theme" onchange="refreshMap()"><option value="">'+T('all_themes')+'</option>'+buildThemeOpts('')+'</select></div>'
    +'<div class="map-ctrl-group"><span class="f-lbl">Show</span><select class="tl-sel" id="map-flagship" onchange="refreshMap()"><option value="">'+T('tl_all')+'</option><option value="1">'+T('tl_flagship')+'</option></select></div>'
    +'<div class="map-stat-bar"><div class="tl-stat"><div class="tl-stat-n" id="map-count">—</div><div class="tl-stat-l">'+T('map_mapped')+'</div></div>'
    +'<div class="tl-stat"><div class="tl-stat-n" id="map-cnt-c">—</div><div class="tl-stat-l">'+T('map_countries')+'</div></div></div>'
    +'</div><div id="map" style="background:var(--bsf-beige);display:flex;align-items:center;justify-content:center"><div class="gen-spinner"><div class="spin"></div>Loading map…</div></div></div>';
  loadLeaflet().then(initMap);
}
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  return new Promise((ok,fail)=>{
    if(!document.getElementById('lft-css')){const c=document.createElement('link');c.id='lft-css';c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(c);}
    if(!document.getElementById('lft-js')){const s=document.createElement('script');s.id='lft-js';s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=fail;document.head.appendChild(s);}
    else{const p=setInterval(()=>{if(window.L){clearInterval(p);ok();}},50);setTimeout(()=>{clearInterval(p);fail();},10000);}
  });
}
function initMap(){
  if(!document.getElementById('map'))return;
  if(leafletMap){leafletMap.remove();leafletMap=null;}
  // Ensure the map div has a real height before Leaflet init
  const mapDiv=document.getElementById('map');
  if(mapDiv&&mapDiv.offsetHeight<10){mapDiv.style.height='500px';}
  leafletMap=L.map('map',{center:[15,20],zoom:2});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',subdomains:'abcd',maxZoom:19}).addTo(leafletMap);
  setTimeout(()=>{if(leafletMap)leafletMap.invalidateSize();},200);
  const leg=L.control({position:'bottomleft'});
  leg.onAdd=function(){
    const d=L.DomUtil.create('div','map-legend');
    d.innerHTML='<div class="map-legend-title">'+T('leg_regions')+'</div>'+Object.entries(RMC).map(([r,c])=>'<div class="map-legend-item"><span class="legend-dot" style="background:'+c+'"></span>'+r+'</div>').join('')+'<div class="map-legend-item" style="margin-top:6px;border-top:1px solid var(--bsf-stone);padding-top:6px"><span class="legend-dot" style="width:14px;height:14px;background:var(--bsf-coral);border:2px solid #fff;box-shadow:0 0 0 2px var(--bsf-coral)"></span>'+T('leg_flagship')+'</div>';
    return d;
  };
  leg.addTo(leafletMap);
  refreshMap();
}
function refreshMap(){
  if(!leafletMap)return;
  mapMarkers.forEach(m=>m.remove());mapMarkers=[];
  const rf=document.getElementById('map-region')?.value||'';
  const tf=document.getElementById('map-theme')?.value||'';
  const ff=document.getElementById('map-flagship')?.value||'';
  const byC={};
  ALL_PROJECTS.forEach(p=>{
    if(!p.coords)return;
    if(rf&&p.region!==rf)return;
    if(tf&&!p.theme.includes(tf))return;
    if(ff==='1'&&!p.flagship)return;
    const k=p.coords.join(',');
    if(!byC[k])byC[k]={coords:p.coords,projs:[],country:p.country.split(';')[0].trim(),region:p.region};
    byC[k].projs.push(p);
  });
  const ctries=new Set();
  Object.values(byC).forEach(({coords,projs,country,region})=>{
    ctries.add(country);
    const n=projs.length,hf=projs.some(p=>p.flagship),col=RMC[region]||'#9B9490';
    const r=Math.max(8,Math.min(28,8+n*2));
    const icon=L.divIcon({className:'',html:'<div style="width:'+(r*2)+'px;height:'+(r*2)+'px;border-radius:50%;background:'+col+';color:white;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:'+(n>9?10:11)+'px;border:'+(hf?'3px solid #FFEC00':'2px solid rgba(255,255,255,.7)')+';box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer">'+n+'</div>',iconSize:[r*2,r*2],iconAnchor:[r,r]});
    const pp=projs.slice(0,5).map(p=>'<div style="padding:5px 0;border-bottom:1px solid #eee"><div style="font-weight:700;font-size:12px;color:#111;margin-bottom:2px">'+(p.title.length>48?p.title.slice(0,46)+'…':p.title)+'</div><div style="font-size:10px;color:#6B6560">'+(p.start||'?')+'–'+(p.end||T('ongoing'))+' · '+p.theme.split(';')[0].trim()+'</div><button onclick="openFromMap(\''+p.id+'\')" style="margin-top:3px;font-size:11.5px;color:#FF5B29;font-weight:700;cursor:pointer;border:none;background:none;font-family:inherit;padding:0">'+T('view_detail')+'</button></div>').join('');
    const more=projs.length>5?'<div style="font-size:11px;color:#9B9490;padding-top:5px">+'+(projs.length-5)+' '+(lang==='fr'?'autres':'more')+'</div>':'';
    const pop=L.popup({maxWidth:280}).setContent('<div style="padding:2px 0"><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#FF5B29;margin-bottom:7px">'+country+' · '+n+' '+(lang==='fr'?'projet(s)':'project(s)')+'</div>'+pp+more+'</div>');
    mapMarkers.push(L.marker(coords,{icon}).addTo(leafletMap).bindPopup(pop));
  });
  const mc=document.getElementById('map-count');if(mc)mc.textContent=Object.values(byC).reduce((s,g)=>s+g.projs.length,0);
  const mcc=document.getElementById('map-cnt-c');if(mcc)mcc.textContent=ctries.size;
}
function openFromMap(id){selectedId=id;renderList();switchTab('projects');currentView='detail';renderDetail(ALL_PROJECTS.find(x=>x.id===id));}

/* ── TOAST ── */
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

/* ── INIT ── */
try{lang=localStorage.getItem('bsf_lang')||'en';}catch(e){}
populateFilters();
applyTranslations();
renderList();
updateStats();
// Show reference table by default on Projects tab
currentView='table';
renderTable();

</script>
